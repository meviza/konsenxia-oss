name: konsexia
description: Premium Healthcare Application with AI Integration and Doctor-to-Doctor Learning
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  bloc_concurrency: ^0.2.4
  equatable: ^2.0.5
  
  # Architecture & Navigation
  get_it: ^7.6.4
  go_router: ^12.1.3
  injectable: ^2.3.2
  
  # Network & Storage
  dio: ^5.3.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Image Viewer
  photo_view: ^0.15.0

  # UI & Design
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  gap: ^3.0.1
  flutter_animate: ^4.5.0
  
  # Media & Files
  image_picker: ^1.0.4
  permission_handler: ^11.1.0
  file_picker: ^6.1.1
  desktop_drop: ^0.4.4
  
  # Authentication & Security
  local_auth: ^2.1.6
  
  # Device & System
  connectivity_plus: ^5.0.1
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  logger: ^2.0.2+1
  
  # JSON & Serialization
  json_annotation: ^4.8.1
  
  # Firebase (for future integration)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  
  # WebSocket for real-time collaboration
  socket_io_client: ^2.0.3+1
  
  # Charts for medical data visualization
  fl_chart: ^0.65.0
  
  # PDF handling for medical reports
  pdf: ^3.10.4
  printing: ^5.11.1

  # Speech-to-text for voice input
  speech_to_text: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.2
  injectable_generator: ^2.4.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
    - assets/animations/
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo.png"
